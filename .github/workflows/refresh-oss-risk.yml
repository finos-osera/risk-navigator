name: Refresh OSS-risk datasets

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-oss-risk
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect, validate, and propose OSS-risk refresh
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix website
          python -m pip install -r requirements-dev.txt

      - name: Refresh and validate OSS-risk datasets
        run: npm run refresh:oss-risk

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Verify Docusaurus static site build
        run: npm run docs:build

      - name: Upload refreshed OSS-risk dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-risk-datasets
          path: |
            oss-risk/data/finos-osera-backpatch-libraries.json
            oss-risk/data/finos-osera-backpatch-scorecards.json
            oss-risk/data/collected-library-scorecards.json
          if-no-files-found: error
          retention-days: 30

      - name: Propose the refreshed OSS-risk dataset PR
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin codex/automated-oss-risk-refresh > /dev/null; then
            git fetch origin codex/automated-oss-risk-refresh:refs/remotes/origin/codex/automated-oss-risk-refresh
          fi
          git switch -C codex/automated-oss-risk-refresh
          git add \
            oss-risk/data/finos-osera-backpatch-libraries.json \
            oss-risk/data/finos-osera-backpatch-scorecards.json \
            oss-risk/data/collected-library-scorecards.json
          if git diff --cached --quiet; then
            echo "No OSS-risk dataset changes detected."
            exit 0
          fi
          git commit -m 'Refresh OSS-risk library scorecards and OSERA OpenVEX evidence'
          git push --force-with-lease origin codex/automated-oss-risk-refresh
          if [ -z "$(gh pr list --head codex/automated-oss-risk-refresh --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head codex/automated-oss-risk-refresh \
              --title 'Refresh OSS-risk library scorecards and OSERA OpenVEX evidence' \
              --body-file .github/oss-risk-refresh-pr.md
          fi
